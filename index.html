<!doctype html>
<html lang="en" data-theme="editorial">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Folio — a quiet, local-first reading room for your PDFs." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Folio</title>
    <script>
      // Apply the saved app theme before first paint to avoid a flash.
      try {
        var p = JSON.parse(localStorage.getItem('folio:prefs') || 'null');
        if (p && p.state && p.state.appTheme) document.documentElement.dataset.theme = p.state.appTheme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
