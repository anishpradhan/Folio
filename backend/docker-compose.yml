# Infrastructure for the Folio AI backend. Start with `npm run ai:db` (or `docker compose up -d` here).
# Credentials come from backend/.env (git-ignored); see .env.example.
name: folio-ai

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-folio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-folio_ai}
    ports:
      # Loopback only: the database is never reachable from the LAN.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - folio_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    # A single reader's metadata and chats are small; keep the footprint modest on an 8 GB laptop.
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40"]
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  folio_pg:
